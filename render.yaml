services:
  - type: web
    name: ai-research-policy-backend
    runtime: python
    rootDir: backend
    # torch is installed from PyTorch's CPU index BEFORE requirements.txt.
    # The default PyPI wheel bundles the whole CUDA runtime (nvidia-cublas,
    # nvidia-cudnn, cuda-toolkit, triton — several GB) and this instance has
    # no GPU, so none of it can ever be used. Installing torch==2.14.0 from
    # the CPU index first satisfies the pin, so the requirements.txt step
    # leaves it alone. `==2.14.0` matches the `2.14.0+cpu` local version per
    # PEP 440. Motivation: the service was hitting its 512 MB memory limit
    # when the embedding model loaded (Render OOM-restarted it mid-index) —
    # this removes the CUDA shared libraries from the image.
    buildCommand: >-
      pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu &&
      pip install -r requirements.txt &&
      python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2')"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: starter
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/research.db
      - key: CHROMA_PERSIST_DIR
        value: /data/chroma
      - key: UPLOADS_DIR
        value: /data/uploads
      # BM25 keyword-search index must live on the mounted disk or it's rebuilt
      # from scratch on every deploy, losing all previously indexed content.
      - key: BM25_INDEX_PATH
        value: /data/bm25.db
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Optional: urlsafe-base64 Fernet key for encrypting stored secrets at rest.
      # If unset, a key file is auto-generated on the mounted /data disk.
      # Generate: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: SECRET_ENCRYPTION_KEY
        sync: false
