name: Dependency vulnerability audit

on:
  push:
    branches: [main]
    paths:
      - "backend/requirements.txt"
      - "frontend/package-lock.json"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/requirements.txt"
      - "frontend/package-lock.json"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    # Catches newly-disclosed CVEs in already-pinned versions, not just new commits.
    - cron: "0 13 * * 1" # every Monday
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Upgrade pip and setuptools
        # setuptools isn't in requirements.txt (it's bundled build tooling,
        # not a project dependency) but pip-audit still flags whatever
        # version the runner's Python install shipped with, so it needs its
        # own explicit upgrade here.
        run: pip install --upgrade pip setuptools
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        # No `pipx run` here on purpose: that spins up its own isolated venv
        # containing only pip-audit itself, so it audits an empty environment
        # instead of the project's dependencies (always reports "no known
        # vulnerabilities found" regardless of what's actually pinned).
        # Running plain `pip-audit` in this same environment, right after
        # installing the project's requirements.txt into it, audits what's
        # actually installed.
        #
        # --ignore-vuln: transformers is capped at <5.0.0 by
        # sentence-transformers==3.3.1's own pin (see requirements.txt) —
        # these 4 have no fix in the 4.x line, and unlocking 5.x risks
        # changing embedding output and invalidating the existing ChromaDB
        # index, so it's a deliberate, documented, separate follow-up rather
        # than something to fix here. Ignored explicitly so this check stays
        # a useful signal for *new* vulnerabilities instead of being
        # permanently red over a known one.
        run: |
          pip-audit --strict --progress-spinner=off \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln PYSEC-2026-2290 \
            --ignore-vuln PYSEC-2026-2288 \
            --ignore-vuln PYSEC-2026-2289

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run npm audit (high/critical only)
        working-directory: frontend
        # --ignore for GHSA-qx2v-qp2m-jg93, GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849
        # (postcss) and GHSA-f88m-g3jw-g9cj (sharp): these are vendored *inside*
        # next's own package.json (dependencies.postcss / optionalDependencies.sharp),
        # not versions this project chooses. As of 2026-08-01 even the latest next
        # release (16.2.12) still bundles the vulnerable postcss@8.4.31 and
        # sharp@^0.34.5 — there is no newer next release that fixes this yet.
        # `npm audit fix --force` "solves" it by downgrading next to 9.3.3, which
        # is far worse than the vulnerabilities themselves — never do that. Revisit
        # by dropping the matching line below once next ships a real fix.
        run: |
          npm audit --audit-level=high --json > audit-result.json || true
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('audit-result.json', 'utf8'));
            const ignored = new Set([
              'GHSA-qx2v-qp2m-jg93',
              'GHSA-6g55-p6wh-862q',
              'GHSA-r28c-9q8g-f849',
              'GHSA-f88m-g3jw-g9cj',
            ]);
            const unresolved = [];
            for (const [name, v] of Object.entries(data.vulnerabilities || {})) {
              const ids = (v.via || [])
                .filter((x) => typeof x === 'object')
                .map((x) => x.url.split('/').pop());
              const stillFlagged = ids.filter((id) => !ignored.has(id));
              if (stillFlagged.length) unresolved.push({ name, ids: stillFlagged });
            }
            if (unresolved.length) {
              console.error('Unresolved high/critical vulnerabilities:', JSON.stringify(unresolved, null, 2));
              process.exit(1);
            }
            console.log('No unresolved high/critical vulnerabilities (only known, upstream-unfixable advisories remain, allowlisted above).');
          "
