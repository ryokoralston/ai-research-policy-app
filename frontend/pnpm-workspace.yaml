# Wait 7 days (10080 minutes) after a version is published before installing it.
# This is the protection npm has no equivalent for: it applies to `pnpm add` and
# `pnpm update` on a developer's machine, not just to Dependabot PRs. Compromised
# releases are typically caught and unpublished well inside that window.
# Installs from the committed lockfile are unaffected.
minimumReleaseAge: 10080

# pnpm blocks dependency install scripts by default -- install scripts are how
# npm supply-chain attacks land. These are the keys pnpm 10 understands; do not
# switch to pnpm 11's `allowBuilds:` map, because Vercel runs pnpm 9/10 for a
# lockfileVersion 9.0 lockfile and would silently ignore it.
#
# Nothing is allowed: build, lint and typecheck all pass with both scripts
# blocked. sharp gets its binary from optionalDependencies rather than from its
# install script, and unrs-resolver's postinstall is only a verification check.
onlyBuiltDependencies: []
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# auditConfig.ignoreGhsas used to suppress three postcss advisories and one
# sharp advisory, because those versions are vendored inside next's own
# package.json (dependencies.postcss / optionalDependencies.sharp) and no next
# 15 release fixes them -- 15.5.23 still pins postcss 8.4.31 and sharp ^0.34.3.
# They are now fixed for real by pnpm.overrides in package.json instead, so the
# suppressions are gone and the audit is an honest signal again. If an override
# ever has to be dropped, put the GHSA back here rather than leaving the audit
# red. Do NOT run `audit fix --force`: it "solves" these by downgrading next to
# 9.3.3, far worse than the advisories.
#
# GHSA-2v37-7h3g-55p8 (nanoid, high) was suppressed here from 2026-08-07 while
# the patched 3.3.17 aged past the minimumReleaseAge gate above. It cleared on
# 2026-08-10 and is now fixed for real by the nanoid override, so the
# suppression is gone and nothing is ignored.
